# LoRA fine-tune of Qwen/Qwen3.5-2B, the shipped model: all targeted rows plus 10k main rows (data/mix2b from make_mix.py). Run with train.py.
model: Qwen/Qwen3.5-2B
train: true
fine_tune_type: lora
data: data/mix2b
adapter_path: adapters/qwen3_5-2b
seed: 0
num_layers: -1
lora_parameters:
  rank: 32
  scale: 2.0
  dropout: 0.05
batch_size: 4
grad_accumulation_steps: 4  # iters count micro-batches; the schedule counts updates
iters: 3316  # one epoch of 13,262 rows
learning_rate: 2.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [2.0e-4, 829, 2.0e-5]
max_seq_length: 1024
mask_prompt: true
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 500
val_batches: 25
save_every: 500

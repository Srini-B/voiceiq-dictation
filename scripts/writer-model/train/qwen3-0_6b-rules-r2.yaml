# Top-up for the rules round: resumes the qwen3-0_6b rules adapter on the value-rewriting format rules (data/rules_format) plus replay of the rules and main sets (data/mix06rf from make_mix.py). Run with mlx_lm.lora.
model: Qwen/Qwen3-0.6B
train: true
fine_tune_type: lora
data: data/mix06rf
adapter_path: adapters/qwen3-0_6b-rules-r2
resume_adapter_file: adapters/qwen3-0_6b-rules/adapters.safetensors
seed: 0
num_layers: -1
lora_parameters:
  rank: 32
  scale: 2.0
  dropout: 0.05
batch_size: 4
grad_accumulation_steps: 4  # iters count micro-batches; the schedule counts updates
iters: ITERS  # one epoch
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 20
  arguments: [1.0e-4, DECAY, 1.0e-5]
max_seq_length: 1024
mask_prompt: true
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
val_batches: 25
save_every: 200

# xcodegen project definition — regenerate the project with `xcodegen generate`.
# The .xcodeproj is NOT checked in; this file is the source of truth.
name: VoiceIQ
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

# One version for the Mac and iPhone apps and their extensions. Changing
# MARKETING_VERSION on main releases both (.github/workflows/release.yml).
# CURRENT_PROJECT_VERSION is the build number: raise it with every release.
settings:
  base:
    MARKETING_VERSION: "0.5.18"
    CURRENT_PROJECT_VERSION: "43"

packages:
  VoiceIQCore:
    path: VoiceIQCore
  # macOS auto-update. See docs/UPDATES.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  # Agent mode's screen observer and action layer (AX + CGEvent). Pinned to a
  # revision: the package has no tagged releases. See docs/AGENT-MODE.md.
  Peekaboo:
    url: https://github.com/openclaw/Peekaboo.git
    revision: 31d67ea858bcd9824f9f8cfe5bb105cc4ff53783

targets:
  VoiceIQ:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: "VoiceiQ"
        PRODUCT_BUNDLE_IDENTIFIER: io.blue.voiceiq
        DEVELOPMENT_TEAM: G8K3545FJ2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/VoiceIQ.entitlements
        ENABLE_HARDENED_RUNTIME: NO # enabled for notarized release builds (M8)
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Sparkle appcast. Every GitHub Release carries appcast.xml, and this URL
        # always resolves to the newest one. Override on the xcodebuild command
        # line to test against a local feed (docs/UPDATES.md).
        VOICEIQ_UPDATE_FEED_URL: https://github.com/Srini-B/voiceiq-dictation/releases/latest/download/appcast.xml
      configs:
        # A clean clone must build with no Apple account at all — ./scripts/build.sh
        # is the README's first command and used to fail for everyone not on the
        # team above with "No signing certificate found". Manual + "-" makes Debug
        # sign ad-hoc, which never consults DEVELOPMENT_TEAM or a provisioning
        # profile, so the team stays hardcoded and only Release depends on it.
        # Ad-hoc still honours the entitlements file, so the mic prompt behaves.
        # To build under your own team: ./scripts/build.sh DEVELOPMENT_TEAM=XXXXXXXXXX
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_REQUIRED: NO
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # iCloud key-value storage (dictionary sync) needs the Developer ID
          # profile; see docs/RELEASING.md.
          CODE_SIGN_ENTITLEMENTS: App/VoiceIQ-Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "VoiceiQ macOS Developer ID"
    sources:
      - path: App/Sources
      - path: App/Resources/VoiceIQ.icns
      - path: App/Resources/MenuBarIcon.png
      - path: App/Resources/MenuBarIcon@2x.png
      - path: App/Resources/SidebarLogo.png
      - path: App/Resources/SidebarLogo@2x.png
      - path: App/Resources/SidebarLogoDark.png
      - path: App/Resources/SidebarLogoDark@2x.png
      # Folder references (blue folders) so bundle subdirectory structure is preserved:
      # Contents/Resources/Fonts/GoogleSansFlex/… etc.
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: VoiceIQCore
      - package: Sparkle
      - package: Peekaboo
        product: PeekabooAutomationKit
      - package: Peekaboo
        product: PeekabooFoundation
      - target: VoiceiQLocalSpeech
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postBuildScripts:
      # Xcode signs Sparkle.framework on copy but not the helpers inside it,
      # which keep Sparkle's ad-hoc signature and fail notarization. The app is
      # signed after this phase, so its seal covers the re-signed framework.
      - name: Sign Sparkle helpers
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/sign-sparkle.sh"'
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VoiceiQ
        CFBundleName: VoiceiQ
        CFBundleIconFile: VoiceIQ
        # Without these the generated plist keeps xcodegen's default 1.0, so the
        # About panel and the DMG filename disagree about the version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true # menu bar app: no Dock icon
        NSMicrophoneUsageDescription: VoiceiQ records audio while you hold the dictation key, so it can transcribe what you say.
        NSAudioCaptureUsageDescription: VoiceiQ records the other side of your calls, so meeting notes include what everyone said.
        NSHumanReadableCopyright: "Copyright 2026 Google LLC. Apache License 2.0. This is not an officially supported Google product."
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: io.blue.voiceiq.url
            CFBundleURLSchemes: [voiceiq]
        SUFeedURL: $(VOICEIQ_UPDATE_FEED_URL)
        # EdDSA public key; the private key signs every update (docs/UPDATES.md).
        SUPublicEDKey: PesOpOtZiCszJi5Y2I91aH+mhMXMxLKgp527NH6oVao=
        # Check every 6 hours and download updates, without Sparkle's
        # second-launch permission prompt. Both are toggles in Settings › About.
        # UpdatePillController decides when a downloaded update installs.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
    scheme:
      testTargets: []
      gatherCoverageData: false

  VoiceiQLocalSpeech:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: VoiceiQLocalSpeech
        PRODUCT_BUNDLE_IDENTIFIER: io.blue.voiceiq.localspeech
        DEVELOPMENT_TEAM: G8K3545FJ2
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_REQUIRED: NO
    sources:
      - path: LocalSpeech/Sources
    dependencies:
      - package: VoiceIQCore
    info:
      path: LocalSpeech/Info.plist
      properties:
        LSBackgroundOnly: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

  # iOS: the app owns audio, keys and transcription; the keyboard is a remote
  # control; the Live Activity shows the background session in the Dynamic
  # Island. See docs/IOS.md.
  VoiceIQiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: "VoiceiQ"
        PRODUCT_BUNDLE_IDENTIFIER: io.blue.voiceiq.ios
        DEVELOPMENT_TEAM: G8K3545FJ2
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_REQUIRED: NO
        # App Store builds (scripts/archive-ios.sh). The profile is created in
        # the Developer portal; see docs/IOS.md "TestFlight".
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "VoiceiQ iOS App Store"
    sources:
      - path: iOS/App/Sources
      - path: iOS/App/Resources
    entitlements:
      path: iOS/App/VoiceIQiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.io.blue.voiceiq]
        # Dictionary sync, shared with the Mac app's store.
        com.apple.developer.ubiquity-kvstore-identifier: G8K3545FJ2.io.blue.voiceiq
    dependencies:
      - package: VoiceIQCore
        product: VoiceIQCore
      - package: VoiceIQCore
        product: VoiceIQBridge
      - target: VoiceIQKeyboard
      - target: VoiceIQLiveActivity
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: VoiceiQ
        CFBundleName: VoiceiQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
        UIAppFonts: [GoogleSansFlex-Regular.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad runs full screen, in Split View and in Stage Manager windows,
        # which needs every orientation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: VoiceiQ records audio when you tap the microphone in the VoiceiQ keyboard or record a meeting, so it can transcribe what you say.
        NSHumanReadableCopyright: "Copyright 2026 Google LLC. Apache License 2.0. This is not an officially supported Google product."
        CFBundleURLTypes:
          - CFBundleURLName: io.blue.voiceiq.ios.url
            CFBundleURLSchemes: [voiceiq]
    scheme:
      testTargets: []
      gatherCoverageData: false

  VoiceIQKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: "VoiceIQKeyboard"
        PRODUCT_BUNDLE_IDENTIFIER: io.blue.voiceiq.ios.keyboard
        DEVELOPMENT_TEAM: G8K3545FJ2
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: iOS/Keyboard/Sources/Keyboard-Bridging-Header.h
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_REQUIRED: NO
        # App Store builds (scripts/archive-ios.sh). The profile is created in
        # the Developer portal; see docs/IOS.md "TestFlight".
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "VoiceiQ Keyboard App Store"
    sources:
      - path: iOS/Keyboard/Sources
    entitlements:
      path: iOS/Keyboard/VoiceIQKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.blue.voiceiq]
    dependencies:
      - package: VoiceIQCore
        product: VoiceIQBridge
    info:
      path: iOS/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: VoiceiQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true

  VoiceIQLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: "VoiceIQLiveActivity"
        PRODUCT_BUNDLE_IDENTIFIER: io.blue.voiceiq.ios.liveactivity
        DEVELOPMENT_TEAM: G8K3545FJ2
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_REQUIRED: NO
        # App Store builds (scripts/archive-ios.sh). The profile is created in
        # the Developer portal; see docs/IOS.md "TestFlight".
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "VoiceiQ Live Activity App Store"
    sources:
      - path: iOS/LiveActivity/Sources
      - path: iOS/LiveActivity/Resources
    entitlements:
      path: iOS/LiveActivity/VoiceIQLiveActivity.entitlements
      properties:
        com.apple.security.application-groups: [group.io.blue.voiceiq]
    dependencies:
      - package: VoiceIQCore
        product: VoiceIQBridge
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: iOS/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: VoiceiQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

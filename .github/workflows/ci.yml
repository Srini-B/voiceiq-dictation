name: CI

on:
  push:
    branches: [main]
  pull_request:

# Same runner image as release.yml, so a PR builds with the Xcode that ships it
# (2026-10-30: a newer Swift accepted code the release's older Xcode rejected).
# xcode-27 carries Xcode 27 and the iOS 27 SDK that App Store uploads need.
jobs:
  core-tests:
    name: VoiceIQCore tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Run package tests
        run: swift test --package-path VoiceIQCore

  app-build:
    name: App build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project VoiceIQ.xcodeproj \
            -scheme VoiceIQ \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tail -20

  ios-build:
    name: iOS build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app, keyboard and Live Activity (Simulator, unsigned)
        run: |
          xcodebuild build \
            -project VoiceIQ.xcodeproj \
            -scheme VoiceIQiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tail -20

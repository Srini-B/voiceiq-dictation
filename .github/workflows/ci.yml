name: CI

on:
  push:
    branches: [main]
  pull_request:

# Same runner image as release.yml, so a PR builds with the Xcode that ships it
# (2026-10-30: a newer Swift accepted code the release's older Xcode rejected).
# xcode-27 carries Xcode 27 and the iOS 27 SDK that App Store uploads need.
jobs:
  core-tests:
    name: VoiceIQCore tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Run package tests
        run: swift test --package-path VoiceIQCore

  app-build:
    name: App build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        # pipefail: without it the job takes tail's exit status, and a
        # BUILD FAILED passes (found 2026-11-26).
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoiceIQ.xcodeproj \
            -scheme VoiceIQ \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee build.log | tail -20
      # tail alone hides the compiler errors; print them and keep the full log.
      - name: Show compiler errors
        if: failure()
        run: grep -E '(error|fatal error):' build.log | sort -u | head -200
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-build-log
          path: build.log

  ios-build:
    name: iOS build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The device build, arm64 only, as TestFlight ships it. The generic
      # Simulator destination also builds x86_64, which a vendored
      # framework may not carry, so it tested something that never ships.
      - name: Build app, keyboard and Live Activity (iPhone, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoiceIQ.xcodeproj \
            -scheme VoiceIQiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee build.log | tail -20
      # tail alone hides the compiler errors; print them and keep the full log.
      - name: Show compiler errors
        if: failure()
        run: grep -E '(error|fatal error):' build.log | sort -u | head -200
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: build.log
